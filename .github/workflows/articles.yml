name: articles

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

jobs:
  execute_pipeline:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: 'install uv'
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: 'setup python env'
      run: |
        uv venv .venv --python 3.11
    - name: install library
      run: uv pip install --python .venv/bin/python tgedr-datasets
    - name: 'pipeline task 1: get articles'
      id: get_articles
      run: | 
        [ ! -d "./datalake" ] && mkdir ./datalake
        .venv/bin/run --module tgedr_datasets.article.etl \
          --classname ArticlesEtl \
          --callable run \
          --classparams "{\"configuration\": {\"tickers_url\": \"./datalake/tickers\", \"target_url\": \"./datalake/articles\"}}" | tee output.log
        cat output.log
      env:
        NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }} 
        ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }} 
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    - name: 'pipeline task 2: create plots'
      id: create_plots
      run: | 
        .venv/bin/run --module tgedr_datasets.utils.plots \
          --callable do_plots \
          --params "{\"articles_url\": \"./datalake/articles\", \"plots_url\": \"./assets\"}" | tee output.log
    - name: Commit and Push changes
      run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datalake/articles assets/article_distribution.png assets/articles_per_processing_time.png
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit . -m "auto: update output data"
            git push
          fi