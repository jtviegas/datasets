name: tickers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 7 1,4,7,10 *'

env:
  HF_DS_TICKERS: "jtviegas/ticker_analysis_tickers"

jobs:
  execute_pipeline:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: 'install uv'
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: 'setup python env'
      run: |
        uv venv .venv --python 3.11
    - name: 'install datasets library'
      run: uv pip install --python .venv/bin/python tgedr-datasets
    - name: 'get new tickers'
      run: |
        .venv/bin/run --module tgedr_datasets.ticker.etl \
          --classname TickerEtl \
          --callable run \
          --classparams "{\"configuration\": {\"source\": \"nasdaq100\", \"dataset\": \"${{ env.HF_DS_TICKERS }}\"}}"
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
    - name: 'plot metrics'
      run: |
        .venv/bin/run --module tgedr_datasets.utils.plots \
          --callable plot_metrics \
          --params "{\"metrics_dir\": \"metrics\", \"dataset_name\": \"tickers\"}"
    - name: 'commit and push metrics'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add metrics/
        git diff --cached --quiet || git commit -m "auto: update metrics [skip ci]"
        git push
