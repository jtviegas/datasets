name: tickers

on:
    workflow_dispatch:

jobs:
  execute_pipeline:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: 'install uv'
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: 'setup python env'
      run: |
        uv venv .venv --python 3.11
    - name: install library
      run: uv pip install --python .venv/bin/python tgedr-datasets
    - name: 'pipeline task 1: get tickers'
      id: get_tickers
      run: | 
        .venv/bin/run --module tgedr_datasets.ticker.etl \
          --classname TickerEtl \
          --callable run \
          --classparams "{\"configuration\": {\"source\": \"nasdaq100\", \"target\": \"./datalake/tickers\"}}"
    - name: Commit and Push changes
      run: |
        echo "config statements"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        echo "git add"
        git add datalake/tickers
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          echo "git commit"
          git commit . -m "auto: update output data"
          echo "git push"
          git push
        fi