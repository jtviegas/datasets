name: prices

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 1-5'

env:
  HF_DS_TICKERS: "jtviegas/ticker_analysis_tickers"
  HF_DS_PRICES: "jtviegas/ticker_analysis_prices"

jobs:
  execute_pipeline:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: 'install uv'
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    # - name : 'install hf'
    #   run: curl -LsSf https://hf.co/cli/install.sh | bash
    # - name: 'login to hf'
    #   run: hf auth login --token ${{ secrets.HF_TOKEN }}
    - name: 'setup python env'
      run: |
        uv venv .venv --python 3.11
    - name: 'install datasets library'
      run: uv pip install --python .venv/bin/python tgedr-datasets
    # - name: 'download existent dataset'
    #   run: |
    #     mkdir ./tmp && \
    #     ./helper.sh download_dataset $HF_DS_TICKERS $TICKERS_FILE tmp && \
    #     ./helper.sh download_dataset $HF_DS_PRICES $PRICES_FILE tmp
    - name: 'get new prices'
      run: | 
        .venv/bin/run --module tgedr_datasets.prices.etl \
          --classname PricesEtl \
          --callable run \
          --classparams "{\"configuration\": {\"tickers_dataset\": \"${{ env.HF_DS_TICKERS }}\", \"target_dataset\": \"${{ env.HF_DS_PRICES }}\"}}"
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
