name: prices

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 1-5'

env:
  HF_DS_TICKERS: "jtviegas/ticker_analysis_tickers"
  HF_DS_PRICES: "jtviegas/ticker_analysis_prices"
  TGEDR_OBSERVABILITY_EXPORTER_METRICS_FILE: metrics/otel
  TGEDR_OBSERVABILITY_SERVICE: datasets

jobs:
  execute_pipeline:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: 'install uv'
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: 'setup python env'
      run: |
        uv venv .venv --python 3.13
    - name: 'install datasets library'
      run: uv pip install --python .venv/bin/python tgedr-datasets
    - name: 'get new prices'
      run: |
        .venv/bin/run --module tgedr_datasets.prices.etl \
          --classname PricesEtl \
          --callable run \
          --classparams "{\"configuration\": { \"tickers_dataset\": \"${{ env.HF_DS_TICKERS }}\", \"target_dataset\": \"${{ env.HF_DS_PRICES }}\"}}"
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
    - name: 'plot metrics'
      run: |
        uv run python -c "from tgedr_observability.plot import plot_metric; \
          plot_metric(path='./metrics/otel', metric_name='rows', attr_key='type', save_path='./metrics/rows.png')"
    - name: 'commit and push metrics'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add metrics/
        git diff --cached --quiet || git commit -m "auto: update metrics [skip ci]"
        git push

